name: Deploy to HostPresto

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTPS deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          exclude: |
            **/.git*
            **/.git/**
            .github/**
            .claude/**
            graveyard/**
            scripts/**
            supabase/**
            node_modules/**
            README.md
            package.json
            package-lock.json
            run-local.bat
            serve-local.ps1
            fetch-log.txt
