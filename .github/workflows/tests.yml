name: Tests

# Runs the full test suite on every pull request into main and every push to main.
# Make main require this check (see WORKFLOW.md) so nothing untested can land.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      # Each stage runs even if an earlier one failed, so one run reports everything
      - name: HTML is valid
        run: npm run test:html
      - name: No broken links or missing files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:links
      - name: Every page works on phone and desktop
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:pages
      - name: Save the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
