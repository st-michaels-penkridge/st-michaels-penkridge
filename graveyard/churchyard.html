function IdentifyTombClicked(event)
{
<!-- Register the x and y coordinates of the stone clicked as a percentage of the whole width and height of the window so that different screen resolutions can be used. -->
var findx = event.clientX/wiwi*100
var findy = event.clientY/wihi*100
<!-- Set a big nominal distance away from any recorded coordinates. Each set of coordinates tested will reduce this until the stone that is closest is identified. If the distance is too great the click will be said to be too far away for identification. -->
var tempxyaway = 10000
<!-- Establish the row at the end of the  whole tombtable. -->
searchend=-1
while (TombTable[searchend][1] !=="EOF")
{
searchend=searchend*1+1;
}
searchend=searchend*1-1;
<!-- Establish how far the clicked coordinate is away from the recorded coordinates. The absolute value shows the distance if it is greater and lalso if it is less than the recorded coordinate. -->
for (stonerow=0; stonerow<searchend; stonerow = stonerow*1+1)
{
xaway = Math.abs(TombTable[stonerow][9]*1-findx*1)
yaway = Math.abs(TombTable[stonerow][10]*1-findy*1)
<!-- Add the two variations together to provide a joint accuracy of the click. -->
xyaway = xaway*1 + yaway*1

if (xyaway < tempxyaway)
{
liverow = stonerow
tempxyaway = xyaway
}
}
<!--Show headstone and inscriptions only if tempxyaway is less than 1 -->
if (tempxyaway < 1*1)
{
subpic=0
fillpicsandtexts()
}
else
{
StonePicObj.src="BlankPic.png"
ArrowObj.style.zIndex=10
ChosenTextObj.innerHTML = ""
PicNoObj.innerHTML =  "No Photos"
}
StonePicObj.style.zIndex = 300

<!--New Entries or Corrections - Send coordinates to clipboard to be pasted into the tombtable if changes or new entries are to be recorded-->
var z = findx + " " + findy
    var dummy = document.createElement("input");
    document.body.appendChild(dummy);
    dummy.setAttribute('value', z);
    dummy.select();
    document.execCommand("copy");
    document.body.removeChild(dummy);
}

for (trailstone=1*1; trailstone<lasttrail+1*1; trailstone = trailstone*1+1)
{
stonelooped = "trailstone" + trailstone
stoneleft = parseInt(document.getElementById(stonelooped).style.left)
stonewidth=parseInt(document.getElementById(stonelooped).style.width)
stonetop = parseInt(document.getElementById(stonelooped).style.top)
stoneheight=parseInt(document.getElementById(stonelooped).style.height)

if (findx>stoneleft && findx<stoneleft+stonewidth && findy>stonetop && findy<stonetop+stoneheight)
{
stoneid=document.getElementById(stonelooped).value
}
}
if (stoneid!="")
{
gettrailstone()
}
}

function gettrailstone()
{
liverow=1
while (TombTable[liverow][1] !==stoneid)
{
liverow=liverow+1
}
hidetrailstones()
subpic=0
fillpicsandtexts()
}

function hidetrailstones()
{
for (trailstone=1*1; trailstone<13; trailstone = trailstone*1+1)
{
stonelooped = "trailstone" + trailstone
LoopTrailObj = document.getElementById(stonelooped)
LoopTrailObj.style.zIndex=5
}
}
